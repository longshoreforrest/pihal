<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Suojattu aineisto</title>
<meta name="robots" content="noindex,nofollow" />
<meta name="description" content="Salattu aineisto. Salasana vaaditaan." />
<style>
  :root { --accent:#3d5afe; --accent-strong:#2a3eb1; --bg:#fafafa; --text:#1a1f36;
          --soft:#4a5568; --muted:#718096; --border:#e5e7eb; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);
    background:radial-gradient(circle at 20% 12%,#eef2ff,transparent 50%),
               radial-gradient(circle at 80% 88%,#eef7ff,transparent 50%),var(--bg);
    display:grid;place-items:center;padding:24px;}
  .gate{width:100%;max-width:420px;background:#fff;border:1px solid var(--border);
    border-radius:18px;padding:34px 32px;
    box-shadow:0 24px 60px rgba(15,23,42,0.08),0 4px 12px rgba(15,23,42,0.04);}
  .brand{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:12px}
  h1{font-size:22px;font-weight:600;letter-spacing:-.01em;margin:0 0 8px}
  p{color:var(--soft);font-size:13.5px;line-height:1.6;margin-bottom:14px}
  .row{display:flex;flex-direction:column;gap:8px;margin-top:14px}
  input{font-size:15px;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;
    outline:none;transition:border-color 120ms;background:white;color:var(--text);}
  input:focus{border-color:var(--accent)}
  button{font-size:14px;font-weight:600;padding:12px 14px;background:var(--accent);color:white;
    border:none;border-radius:10px;cursor:pointer;transition:background 120ms;}
  button:hover{background:var(--accent-strong)}
  button:disabled{opacity:.6;cursor:wait}
  .err{color:#b91c1c;font-size:12.5px;margin-top:8px;min-height:1em}
  .meta{margin-top:18px;padding-top:14px;border-top:1px solid var(--border);
    font-size:11px;color:var(--muted);letter-spacing:.04em;}
</style>
</head>
<body>
  <main class="gate" role="main" aria-label="Avaa suojattu aineisto">
    <div class="brand">Suojattu aineisto</div>
    <h1>Tämä sivu on lukittu.</h1>
    <p>Sisältö on AES-256-salattua. Syötä salasana avataksesi ja lukeaksesi selaimessa. Mitään ei lähetetä verkkoon — salauksen purku tapahtuu paikallisesti laitteellasi.</p>

      <input id="pw" type="password" placeholder="Salasana" autocomplete="off" autofocus />
      <button id="b" type="submit">Avaa</button>
      <div class="err" id="err" role="alert">&nbsp;</div>
    </form>

  <script>
  (() => {
    const EL = document.getElementById('payload');
    const PAYLOAD = JSON.parse(EL.textContent); EL.remove();
    const STORE_KEY = "pihal:auth-v1";
    const TTL_MS = 24 * 60 * 60 * 1000;
    const td = new TextDecoder(), te = new TextEncoder();
    const b64dec = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

    async function deriveKey(password, salt) {
      const baseKey = await crypto.subtle.importKey('raw', te.encode(password), 'PBKDF2', false, ['deriveKey']);
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt, iterations: 600000, hash: 'SHA-256' },
        baseKey, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    }
    async function decryptWith(password) {
      const key = await deriveKey(password, b64dec(PAYLOAD.salt));
      const pt = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: b64dec(PAYLOAD.iv) }, key, b64dec(PAYLOAD.ciphertext));
      return td.decode(pt);
    }
    function reveal(html){ document.open(); document.write(html); document.close(); }
    function getStored(){
      try { const raw = localStorage.getItem(STORE_KEY); if(!raw) return null;
        const o = JSON.parse(raw);
        if(!o || typeof o.p!=='string' || typeof o.t!=='number') return null;
        if(Date.now()-o.t > TTL_MS){ localStorage.removeItem(STORE_KEY); return null; }
        return o.p; } catch(e){ return null; }
    }
    function setStored(p){ try{ localStorage.setItem(STORE_KEY, JSON.stringify({p, t:Date.now()})); }catch(e){} }
    function pwFromUrl(){
      try { const h=(location.hash||'').replace(/^#/,''); const q=(location.search||'').replace(/^\?/,'');
        const src=/(^|[&;])(pw|p|key)=/.test(h)?h:q; const params=new URLSearchParams(src);
        return params.get('pw')||params.get('p')||params.get('key')||''; } catch(e){ return ''; }
    }
    function cleanUrl(){ try{ history.replaceState(null,'',location.pathname); }catch(e){} }
    function showErr(m){ const e=document.getElementById('err'); if(e) e.textContent=m; }

    const urlPw = pwFromUrl(), stored = getStored();
    if (urlPw) {
      decryptWith(urlPw).then((html)=>{ setStored(urlPw); cleanUrl(); reveal(html); })
        .catch(()=>{ cleanUrl(); if(stored) decryptWith(stored).then(reveal).catch(()=>showErr('Väärä salasana.')); else showErr('Väärä salasana.'); });
    } else if (stored) {
      decryptWith(stored).then(reveal).catch(()=>{});
    }
    document.getElementById('f').addEventListener('submit', async (ev)=>{
      ev.preventDefault();
      const btn=document.getElementById('b'), err=document.getElementById('err');
      const pw=document.getElementById('pw').value;
      btn.disabled=true; btn.textContent='Puretaan…'; err.textContent='';
      try { const html=await decryptWith(pw); setStored(pw); reveal(html); }
      catch(e){ btn.disabled=false; btn.textContent='Avaa'; err.textContent='Väärä salasana.'; document.getElementById('pw').select(); }
    });
  })();
  </script>
